# 构建与运行
services:
  blazor-learn-site:
    build: .
    image: blazor-learn-site:latest
    container_name: blazor-learn-site
    ports:
      - "8080:8080"            # 宿主机 8080 → 容器 8080
    environment:
      # SQLite 数据库放在持久化卷内，容器重建不丢数据
      - ConnectionStrings__DefaultConnection=Data Source=/app/Data/app.db
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - blazor-data:/app/Data
    restart: unless-stopped

# 数据卷：用户、角色、学习进度全部存这里
volumes:
  blazor-data:
